<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache">
<title>SRR — Gecko Room</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Myanmar:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --blue:#1877f2;--blue-dk:#166fe5;--blue-lt:#e7f3ff;
  --bg:#f0f2f5;--surface:#fff;--border:#dde1e7;--text:#050505;--muted:#65676b;--hover:#f2f3f5;
  --green:#42b72a;--green-dk:#1a5c0c;--green-lt:#e6f4ea;
  --red:#fa3e3e;--red-dk:#9b1c1c;--red-lt:#fdeaea;
  --amber:#f7b928;--amber-dk:#856404;--amber-lt:#fff3cd;
  --font:'Inter','Noto Sans Myanmar',sans-serif;--r:10px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:14px;min-height:100vh;padding-bottom:40px}
.my{font-family:'Noto Sans Myanmar',var(--font);font-weight:400;color:var(--muted);font-size:.85em}
button{font-family:var(--font)}

/* NAV + TABS */
.nav{background:var(--blue);height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;position:sticky;top:0;z-index:300;box-shadow:0 2px 8px rgba(24,119,242,.3);gap:10px}
.nav-logo{display:flex;align-items:center;gap:10px;color:#fff;min-width:0}
.nav-ico{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.nav-name{font-size:15px;font-weight:700;line-height:1.2;white-space:nowrap}
.nav-sub{font-size:10.5px;color:rgba(255,255,255,.8);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-right{display:flex;align-items:center;gap:8px;flex-shrink:0}
.pill{font-size:11px;font-weight:700;padding:4px 10px;border-radius:20px;background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.35);cursor:pointer;white-space:nowrap}
.pill.ok{background:#e6f4ea;color:var(--green-dk);border-color:var(--green)}
.pill.warn{background:var(--amber-lt);color:var(--amber-dk);border-color:var(--amber)}
.pill.err{background:var(--red-lt);color:var(--red-dk);border-color:var(--red)}
.clock{font-size:11px;color:rgba(255,255,255,.85);white-space:nowrap}
.tabs{background:var(--surface);border-bottom:1px solid var(--border);display:flex;padding:0 12px;overflow-x:auto;position:sticky;top:56px;z-index:250}
.tab{padding:10px 13px;border:none;background:transparent;font-size:13px;font-weight:700;cursor:pointer;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap;line-height:1.25;text-align:center;position:relative}
.tab .my{display:block;font-size:10px}
.tab.on{color:var(--blue);border-bottom-color:var(--blue)}
.tab:hover{background:var(--hover)}
.tab .badge{position:absolute;top:4px;right:2px;background:var(--red);color:#fff;font-size:9.5px;font-weight:800;border-radius:9px;padding:1px 5px}
.main{max-width:1180px;margin:0 auto;padding:14px 12px}

/* CARDS / FIELDS */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);box-shadow:0 1px 2px rgba(0,0,0,.06);margin-bottom:12px;overflow:hidden}
.card-h{padding:10px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:#fafbfc}
.card-t{font-size:14px;font-weight:800}
.card-t .my{font-weight:400}
.card-b{padding:12px 14px}
.sp{flex:1}
.lbl{font-size:10.5px;font-weight:700;color:var(--muted);letter-spacing:.03em;text-transform:uppercase;margin-bottom:3px;display:block}
.lbl .my{text-transform:none;letter-spacing:0;font-size:10.5px}
.in{width:100%;padding:8px 10px;border:1.5px solid var(--border);border-radius:7px;font-size:14px;font-family:var(--font);color:var(--text);background:var(--bg);outline:none}
.in:focus{border-color:var(--blue);background:#fff}
textarea.in{resize:vertical;min-height:56px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.fld{margin-bottom:10px}
.btn{padding:9px 16px;border-radius:8px;border:1.5px solid var(--border);background:#fff;font-size:13px;font-weight:700;cursor:pointer;color:var(--text);line-height:1.2}
.btn:hover{background:var(--hover)}
.btn.pri{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.pri:hover{background:var(--blue-dk)}
.btn.grn{background:var(--green);border-color:var(--green);color:#fff}
.btn.red{background:#fff;border-color:var(--red);color:var(--red-dk)}
.btn.sm{padding:5px 10px;font-size:12px}
.btn .my{color:inherit;opacity:.85}
.btn:disabled{opacity:.45;cursor:default}
.seg{display:flex;gap:4px;flex-wrap:wrap}
.seg button{flex:1;min-width:54px;padding:7px 6px;border-radius:7px;border:1.5px solid var(--border);background:#fff;font-size:12px;font-weight:700;cursor:pointer;color:var(--muted);line-height:1.15}
.seg button .my{display:block;font-size:9.5px;color:inherit}
.seg button.on{background:var(--blue-lt);border-color:var(--blue);color:var(--blue)}
.seg button:disabled{opacity:.35;cursor:default}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.tog{padding:6px 10px;border-radius:18px;border:1.5px solid var(--border);background:#fff;font-size:12px;font-weight:700;cursor:pointer;color:var(--muted);line-height:1.15;text-align:center}
.tog .my{display:block;font-size:9.5px;color:inherit}
.tog.on{background:var(--blue);border-color:var(--blue);color:#fff}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:3px 9px;border-radius:12px;background:var(--hover);color:var(--muted);border:1px solid var(--border);white-space:nowrap}
.chip.b{background:var(--blue-lt);color:var(--blue);border-color:#9cc4f7}
.chip.g{background:var(--green-lt);color:var(--green-dk);border-color:#9fd89a}
.chip.r{background:var(--red-lt);color:var(--red-dk);border-color:#f3a5a5}
.chip.a{background:var(--amber-lt);color:var(--amber-dk);border-color:#f2d27d}
.prefill{background:var(--amber-lt);border:1px solid #f2d27d;color:var(--amber-dk);border-radius:8px;padding:8px 12px;font-size:12.5px;font-weight:600;margin-bottom:10px}
.empty{color:var(--muted);text-align:center;padding:22px;font-size:13px}
.note{font-size:11.5px;color:var(--muted)}
.strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:8px;margin-bottom:12px}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:10px;text-align:center}
.stat b{display:block;font-size:24px;font-weight:800;line-height:1.1}
.stat span{font-size:10.5px;color:var(--muted);font-weight:700;line-height:1.25;display:block}
.stat small{display:block;font-size:10.5px;color:var(--muted);margin-top:2px}
.sp-dot{display:inline-block;width:10px;height:10px;border-radius:3px;vertical-align:-1px;margin-right:4px}
.sp-badge{display:inline-block;font-size:11px;font-weight:800;color:#fff;border-radius:6px;padding:2px 7px}

/* TOP BAR */
.topbar{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.topbar .f-emp{flex:1;min-width:170px}
.datebox{display:flex;gap:4px;align-items:center}
.datebox .in{width:150px}
.datebox .btn{padding:8px 10px}
.rowbtns{display:flex;gap:6px;flex-wrap:wrap}
.rowbtn{padding:7px 12px;border-radius:8px;border:1.5px solid var(--border);background:#fff;font-weight:800;font-size:13px;cursor:pointer;line-height:1.15;text-align:center;min-width:70px}
.rowbtn small{display:block;font-size:10px;font-weight:600;color:var(--muted)}
.rowbtn.on{background:var(--blue);border-color:var(--blue);color:#fff}
.rowbtn.on small{color:rgba(255,255,255,.85)}

/* DASHBOARD MAP */
.map-row{display:flex;gap:10px;align-items:stretch;margin-bottom:8px}
.map-lbl{width:62px;flex-shrink:0;background:#f5f6f8;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;font-size:13px;line-height:1.1;text-align:center;padding:4px}
.map-lbl small{font-size:9.5px;color:var(--muted);font-weight:600}
.map-racks{display:flex;gap:5px;flex-wrap:wrap;flex:1}
.mrack{width:64px;border-radius:7px;color:#fff;padding:4px 4px 5px;cursor:pointer;text-align:center;line-height:1.15;border:3px solid transparent;position:relative}
.mrack b{display:block;font-size:13px}
.mrack span{display:block;font-size:9.5px;font-weight:600;opacity:.95}
.mrack.due{border-color:#1877f2;box-shadow:0 0 0 2px #fff inset}
.mrack.over{border-color:#e02424;box-shadow:0 0 0 2px #fff inset}
.mrack.done{border-color:#42b72a;box-shadow:0 0 0 2px #fff inset}
.mrack .st{position:absolute;top:-6px;right:-6px;background:#fff;border-radius:50%;width:17px;height:17px;font-size:10px;line-height:17px;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11px;color:var(--muted);margin-top:8px;align-items:center}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin-right:4px}
.spcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(205px,1fr));gap:10px;margin-bottom:12px}
.spcard{background:#fff;border:1px solid var(--border);border-radius:12px;overflow:hidden}
.spcard-h{color:#fff;padding:9px 12px;font-weight:800;display:flex;justify-content:space-between;align-items:baseline;gap:6px}
.spcard-h b{font-size:26px;line-height:1}
.spcard-h small{font-size:10.5px;font-weight:600;opacity:.95;display:block}
.spages{display:grid;grid-template-columns:repeat(4,1fr);text-align:center;padding:7px 4px;border-bottom:1px solid var(--border)}
.spages b{display:block;font-size:16px;font-weight:800}
.spages span{font-size:9.5px;color:var(--muted);font-weight:700}
.spfoot{padding:6px 10px;font-size:11px;color:var(--muted);font-weight:600;display:flex;justify-content:space-between;gap:4px 10px;flex-wrap:wrap}
.spfoot span{white-space:nowrap}

/* TODAY */
.rowblock{margin-bottom:14px}
.rowblock-h{display:flex;align-items:center;gap:8px;margin:0 0 6px;font-weight:800;font-size:15px;flex-wrap:wrap}
.tcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:8px}
.tcard{background:#fff;border:2px solid var(--border);border-radius:10px;padding:9px 10px;display:flex;flex-direction:column;gap:7px}
.tcard.done{border-color:#9fd89a;background:#f7fdf6}
.tcard.over{border-color:#f3a5a5}
.tcard.run{border-color:var(--blue);box-shadow:0 0 0 3px rgba(24,119,242,.15)}
.tcard-h{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.tcard-h .rk{font-size:16px;font-weight:800;white-space:nowrap}
.ttasks{display:flex;gap:4px;flex-wrap:wrap}
.tt{font-size:11.5px;font-weight:700;padding:3px 8px;border-radius:12px;border:1.5px solid;background:#fff;white-space:nowrap}
.tt.done{background:var(--green-lt);border-color:#9fd89a !important;color:var(--green-dk) !important;text-decoration:line-through;opacity:.85}
.tt.over{background:var(--red-lt)}
.tbtns{display:flex;gap:6px}
.tbtns .btn{flex:1;padding:7px 8px;font-size:12px}
.timer{font-weight:800;color:var(--blue);font-variant-numeric:tabular-nums}
.prep{border:2px dashed var(--amber);background:var(--amber-lt);border-radius:10px;padding:10px 12px;margin-bottom:12px}
.prep-i{display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px dashed #f2d27d;flex-wrap:wrap}
.prep-i:last-child{border-bottom:none}
.prep-i.done{opacity:.55;text-decoration:line-through}

/* ROOM / RACKS */
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.rcard{background:#fff;border:1px solid var(--border);border-radius:12px;overflow:hidden;cursor:pointer;transition:transform .08s;display:flex;flex-direction:column}
.rcard:hover{transform:translateY(-1px);box-shadow:0 3px 10px rgba(0,0,0,.08)}
.rcard-h{color:#fff;padding:8px 10px;display:flex;align-items:center;gap:6px}
.rcard-h .rk{font-size:18px;font-weight:800}
.rcard-h .sz{margin-left:auto;font-size:11px;font-weight:800;background:rgba(255,255,255,.25);border-radius:6px;padding:2px 6px}
.rcard-b{padding:8px 10px;font-size:12px;line-height:1.55;flex:1}
.rcard-b .big{font-size:20px;font-weight:800}
.agebar{display:flex;height:7px;border-radius:4px;overflow:hidden;background:#e4e6eb;margin:5px 0}
.agebar i{display:block;height:100%}
.rcard-f{padding:6px 10px;border-top:1px solid var(--border);font-size:11px;color:var(--muted);font-weight:600;display:flex;gap:6px;flex-wrap:wrap}
.add-card{border:2px dashed #9cc4f7;background:var(--blue-lt);color:var(--blue);display:flex;align-items:center;justify-content:center;font-weight:800;min-height:120px;border-radius:12px;cursor:pointer;text-align:center}

/* RACK SHEET */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:500;display:none;align-items:flex-start;justify-content:center;padding:14px 8px;overflow-y:auto}
.ov.open{display:flex}
.sheet{background:#fff;border-radius:12px;width:100%;max-width:820px;box-shadow:0 10px 40px rgba(0,0,0,.3);display:flex;flex-direction:column;max-height:calc(100vh - 28px)}
.sheet.wide{max-width:1100px}
.sheet-h{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--border)}
.sheet-t{font-size:16px;font-weight:800;flex:1;line-height:1.2}
.sheet-b{padding:12px 14px;overflow-y:auto}
.sheet-f{display:flex;gap:8px;justify-content:flex-end;padding:10px 14px;border-top:1px solid var(--border);flex-wrap:wrap;align-items:center}
.x{width:34px;height:34px;border-radius:50%;border:none;background:#f0f2f5;font-size:15px;cursor:pointer;flex-shrink:0}
.sec{font-size:11px;font-weight:800;color:var(--blue);letter-spacing:.04em;text-transform:uppercase;margin:14px 0 8px;padding-top:10px;border-top:1px solid var(--border)}
.sec:first-child{margin-top:0;border-top:none;padding-top:0}
.sec .my{text-transform:none;letter-spacing:0;color:var(--muted)}
.subtabs{display:flex;gap:4px;border-bottom:1px solid var(--border);padding:0 14px;background:#fafbfc}
.subtab{padding:9px 12px;border:none;background:none;font-weight:700;font-size:12.5px;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;line-height:1.2}
.subtab .my{display:block;font-size:9.5px}
.subtab.on{color:var(--blue);border-bottom-color:var(--blue)}
.trays{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:5px}
.tray{border:2px solid var(--border);border-radius:7px;padding:4px 3px;text-align:center;cursor:pointer;user-select:none;background:#fff;line-height:1.15;min-height:54px;position:relative}
.tray .n{font-size:12px;font-weight:800}
.tray .a{font-size:9.5px;font-weight:800;border-radius:4px;color:#fff;padding:0 4px;display:inline-block;margin:2px 0}
.tray .c{font-size:10.5px;font-weight:700;color:var(--text)}
.tray.empty{background:#f7f8fa;color:#b0b3b8}
.tray.empty .c{color:#b0b3b8}
.tray.sel{border-color:var(--blue);background:var(--blue-lt);box-shadow:0 0 0 2px var(--blue) inset}
.tray .nt{position:absolute;top:1px;right:3px;font-size:9px}
.bulk{position:sticky;bottom:0;background:#fff;border:2px solid var(--blue);border-radius:10px;padding:10px 12px;margin-top:10px;box-shadow:0 -4px 14px rgba(0,0,0,.08)}
.bulk-h{font-weight:800;color:var(--blue);margin-bottom:8px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.cnt{display:flex;gap:4px;align-items:center}
.cnt .in{text-align:center;font-weight:800;padding:7px 4px}
.cnt .btn{padding:6px 11px;font-size:15px}
.selbar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
.selbar .in{width:64px;padding:6px}

/* CALENDAR */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .dow{font-size:10.5px;font-weight:800;color:var(--muted);text-align:center;padding:4px 0;line-height:1.15}
.cal .dow .my{display:block;font-size:9px}
.cday{min-height:84px;border:1.5px solid var(--border);border-radius:8px;background:#fff;padding:4px;cursor:pointer;font-size:11px;overflow:hidden}
.cday .dn{font-weight:800;font-size:12.5px;margin-bottom:2px;display:flex;justify-content:space-between}
.cday.other{opacity:.4}
.cday.closed{background:#f3f4f6;cursor:default}
.cday.today{border-color:var(--blue);box-shadow:0 0 0 2px rgba(24,119,242,.25)}
.cday.sel{background:var(--blue-lt);border-color:var(--blue)}
.cday .ev{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:700;border-radius:4px;padding:0 3px;margin-bottom:2px;color:#fff;font-size:10px}
.rule{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid #eef0f3;flex-wrap:wrap}
.rule:last-child{border-bottom:none}
.rule .ic{width:36px;height:36px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.rule .tx{flex:1;min-width:200px;line-height:1.4}
.rule .tx b{font-size:13.5px}
.rule.paused{opacity:.5}

/* TABLES */
.tbl-wrap{overflow-x:auto}
table.t{width:100%;border-collapse:collapse;font-size:12.5px;background:#fff}
table.t th{background:#f5f6f8;font-size:10.5px;font-weight:800;color:var(--muted);padding:7px 9px;text-align:center;border-bottom:2px solid var(--border);white-space:nowrap;line-height:1.2}
table.t th .my{display:block;font-weight:400;font-size:9.5px}
table.t th:first-child,table.t td:first-child{text-align:left}
table.t td{padding:6px 9px;border-bottom:1px solid #eef0f3;text-align:center;white-space:nowrap}
table.t tr.tot td{background:#f5f6f8;font-weight:800;border-top:2px solid var(--border)}
table.t td.low{background:var(--red-lt);color:var(--red-dk);font-weight:800}
.supply{display:grid;grid-template-columns:1fr 150px 90px 80px 34px;gap:8px;align-items:center;padding:7px 0;border-bottom:1px solid #eef0f3}
.supply.low .nm{color:var(--red-dk)}
.supply .nm{font-weight:700;line-height:1.25}
.bars{display:flex;gap:6px;align-items:flex-end;height:110px;padding-top:8px}
.bars .bc{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;font-size:10px;color:var(--muted);font-weight:700}
.bars .bc i{display:block;width:70%;background:var(--blue);border-radius:4px 4px 0 0;min-height:2px}
.bars .bc b{color:var(--text);font-size:11px}

.toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%) translateY(10px);padding:10px 18px;border-radius:9px;font-size:13px;font-weight:600;opacity:0;transition:all .25s;z-index:900;pointer-events:none;background:#333;color:#fff;max-width:92vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.ok{background:var(--green)}.toast.err{background:var(--red)}
.tbx{display:flex;align-items:center;gap:5px}
.tbx .tin{width:86px;flex:0 0 86px;text-align:center;font-weight:800;letter-spacing:.5px;padding:7px 6px}
.tbx .tin.bad{border-color:var(--red);background:var(--red-lt)}
.t12{font-size:10.5px;color:var(--muted);font-weight:700;white-space:nowrap}
.timebox{display:flex;gap:6px;align-items:center}

@media(max-width:640px){
  .g3,.g4{grid-template-columns:1fr 1fr}
  .nav-name{font-size:13.5px}
  .clock{display:none}
  .mrack{width:54px}
  .map-lbl{width:46px;font-size:11px}
  .cday{min-height:58px;padding:2px}
  .cday .ev{font-size:9px;padding:0 2px}
  .supply{grid-template-columns:1fr 128px 70px;}
  .supply .mn,.supply .x{display:none}
  .tcards{grid-template-columns:1fr}
  .g2.stack{grid-template-columns:1fr}
  .sheet .strip{grid-template-columns:repeat(3,1fr);gap:5px}
  .sheet .stat{padding:6px 4px}
  .sheet .stat b{font-size:18px}
  .sheet .stat span{font-size:9.5px}
  .trays{grid-template-columns:repeat(auto-fill,minmax(54px,1fr));gap:4px}

// SMALL HELPERS

function pad(n){ return String(n).padStart(2,'0'); }
function ymd(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function todayStr(){ return ymd(new Date()); }
function nowHM(){ var d=new Date(); return pad(d.getHours())+':'+pad(d.getMinutes()); }
function parseYmd(s){ var p=String(s).split('-'); return new Date(+p[0], +p[1]-1, +p[2]); }
function addDays(s, n){ var d=parseYmd(s); d.setDate(d.getDate()+n); return ymd(d); }
function dayDiff(a, b){ var p=a.split('-'), q=b.split('-'); return Math.round((Date.UTC(+q[0],+q[1]-1,+q[2]) - Date.UTC(+p[0],+p[1]-1,+p[2]))/86400000); }
function dow(s){ return parseYmd(s).getDay(); }
function sunOf(s){ return addDays(s, -dow(s)); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function num(v){ var n=parseFloat(v); return isNaN(n)?0:n; }
function clone(o){ return JSON.parse(JSON.stringify(o)); }
function uid(p){ return p + Date.now().toString(36) + Math.random().toString(36).slice(2,6); }
function niceDate(s){
  if(!s) return '—';
  var t=todayStr(), d=dayDiff(t, s);
  if(d===0) return 'Today';
  if(d===1) return 'Tomorrow';
  if(d===-1) return 'Yesterday';
  var x=parseYmd(s); return DOW[x.getDay()].en+' '+x.getDate()+' '+x.toLocaleDateString('en-GB',{month:'short'});
}
function niceDateMy(s){ var d=dayDiff(todayStr(), s); return d===0?'ယနေ့':d===1?'မနက်ဖြန်':d===-1?'မနေ့က':DOW[dow(s)].my; }
function mins(s,e){
  if(!s||!e) return null;
  var a=s.split(':'), b=e.split(':');
  var d=(+b[0]*60+(+b[1]||0))-(+a[0]*60+(+a[1]||0)); if(d<0) d+=1440;
  return d;
}
function fmtMin(m){ if(m==null) return '—'; return m>=60 ? Math.floor(m/60)+'h '+pad(m%60)+'m' : m+' min'; }
function sp(k){ for(var i=0;i<SPECIES.length;i++) if(SPECIES[i].k===k) return SPECIES[i]; return {k:k||'?',en:k||'No species',my:'',c:'#9ca3af'}; }

// ── TYPED TIME (no clock dial) ── 630, 0630, 6:30, 14, 2pm → "HH:MM"
function normTime(raw){
  var s=String(raw||'').trim().toLowerCase().replace(/\s+/g,'');
  if(!s) return '';
  var pm=/p/.test(s), am=/a/.test(s);
  s=s.replace(/[apm]/g,'').replace(/[.:]+$/,'');
  var h, m, parts=s.split(/[:.\-h]/).filter(String);
  if(parts.length>=2){ h=+parts[0]; m=+parts[1]; }
  else {
    var d=parts[0]||''; if(!/^\d{1,4}$/.test(d)) return null;
    if(d.length<=2){ h=+d; m=0; } else if(d.length===3){ h=+d[0]; m=+d.slice(1); } else { h=+d.slice(0,2); m=+d.slice(2); }
  }
  if(isNaN(h)||isNaN(m)) return null;
  if(pm && h<12) h+=12; if(am && h===12) h=0;
  if(m>59 || h>23) return null;
  return pad(h)+':'+pad(m);
}
function to12(v){ if(!v||!/^\d\d:\d\d$/.test(v)) return ''; var h=+v.slice(0,2); return (h%12||12)+':'+v.slice(3)+' '+(h<12?'AM':'PM'); }
function tbox(field, val){
  return '<span class="tbx"><input class="in tin" type="text" inputmode="numeric" autocomplete="off" maxlength="8" placeholder="HH:MM" id="lg-'+field+'"'+
    ' value="'+esc(val||'')+'" onchange="tChange(this,\''+field+'\')" onkeydown="if(event.key===\'Enter\')this.blur()">'+
    '<span class="t12">'+to12(val)+'</span></span>';
}
function tChange(el, field){
  var v=normTime(el.value);
  if(v===null){ el.classList.add('bad'); showToast('Type a time like 6:30 or 1430 or 2pm · အချိန် ရိုက်ပါ','err'); return; }
  el.classList.remove('bad'); el.value=v; el.nextElementSibling.textContent=to12(v);
  LG[field]=v; updLogMins();
}

function rackName(r){ return 'Row '+r.row+' · Rack '+r.num; }

function trayOf(r, i){

  return { a: t.a || r.age || '', f: num(t.f), m: num(t.m), u: num(t.u),
           i: Array.isArray(t.i) ? t.i : (r.items || []), cr: t.cr!=null ? t.cr : (r.cr||''), mw: t.mw!=null ? t.mw : (r.mw||''), n: t.n || '' };
}
function rackTotals(r){
  var o={f:0,m:0,u:0,n:0,used:0,trays:num(r.trays),age:{}};
  AGES.forEach(function(a){ o.age[a.k]={f:0,m:0,u:0,n:0,trays:0}; });
  for(var i=1;i<=o.trays;i++){
    var t=trayOf(r,i), n=t.f+t.m+t.u;
    o.f+=t.f; o.m+=t.m; o.u+=t.u; o.n+=n; if(n) o.used++;
    var g=o.age[t.a]; if(g && n){ g.f+=t.f; g.m+=t.m; g.u+=t.u; g.n+=n; g.trays++; }
  }
  return o;
}
function totals(list){
  var o={f:0,m:0,u:0,n:0,used:0,trays:0,racks:0,age:{},sp:{}};
  AGES.forEach(function(a){ o.age[a.k]={f:0,m:0,u:0,n:0,trays:0}; });
  list.forEach(function(r){
    var t=rackTotals(r); o.racks++;
    ['f','m','u','n','used','trays'].forEach(function(k){ o[k]+=t[k]; });
    AGES.forEach(function(a){ ['f','m','u','n','trays'].forEach(function(k){ o.age[a.k][k]+=t.age[a.k][k]; }); });
    var s=o.sp[r.sp]||(o.sp[r.sp]={racks:0,trays:0,used:0,f:0,m:0,u:0,n:0,age:{}});
    s.racks++; s.trays+=t.trays; s.used+=t.used; s.f+=t.f; s.m+=t.m; s.u+=t.u; s.n+=t.n;
    AGES.forEach(function(a){ var x=s.age[a.k]||(s.age[a.k]={n:0,f:0,m:0,u:0,trays:0}); ['f','m','u','n','trays'].forEach(function(k){ x[k]+=t.age[a.k][k]; }); });
  });
  return o;
}
function sexStr(f,m,u){ var a=[]; if(f) a.push(f+'♀'); if(m) a.push(m+'♂'); if(u) a.push(u+'?'); return a.join(' ')||'—'; }

// ══════════════════════════════════════════════════════════════════
// SCHEDULE ENGINE (same rules are used by Code.gs for the emails)
// rule: {task, rows:[1,2]|[] (all), racks:[3,4]|[] (all — only when one row),
//        sp:['LPG']|[], unit:'once'|'day'|'week', every:N, days:[0..6],
//        start, end, prep:N days before, skip:{date:1}, active}
// A day that is closed (Saturday by default) moves its work to the next open day.
// ══════════════════════════════════════════════════════════════════
function allRules(){ return Object.keys(DB.rule).map(function(k){ return DB.rule[k]; }).filter(function(r){ return !r.deleted; }); }
function rawOcc(r, d){
  if(!r.start || d < r.start) return false;
  if(r.end && d > r.end) return false;
  var diff=dayDiff(r.start, d), ev=Math.max(1, Math.round(num(r.every))||1);
  if(r.unit==='once') return diff===0;
  if(r.unit==='day') return diff % ev === 0;
  var days=(r.days && r.days.length) ? r.days : [dow(r.start)];
  if(days.indexOf(dow(d))<0) return false;
  return Math.floor(dayDiff(sunOf(r.start), sunOf(d))/7) % ev === 0;
}
function occurs(r, d){
  if(!r || r.deleted || r.active===false) return false;
  if(isClosed(d)) return false;
  var sk=r.skip||{};
  if(rawOcc(r,d) && !sk[d]) return true;
  var p=d;
  for(var i=0;i<6;i++){ p=addDays(p,-1); if(!isClosed(p)) break; if(rawOcc(r,p) && !sk[p]) return true; }
  return false;
}
function ruleRacks(r){
  var rows=(r.rows && r.rows.length) ? r.rows.map(Number) : null;
  return allRacks().filter(function(k){
    if(rows && rows.indexOf(+k.row)<0) return false;
    if(r.racks && r.racks.length && r.racks.map(Number).indexOf(+k.num)<0) return false;
    if(r.sp && r.sp.length && r.sp.indexOf(k.sp)<0) return false;
    return true;
  });
}
function ruleTargets(r){
  // row-level tasks (Prepare utensils) give one item per row, rack tasks one per rack
  if(task(r.task).row){
    var rows=(r.rows && r.rows.length) ? r.rows.map(Number) : rowsList();
    return rows.map(function(n){ return {id:rowLevelId(n), row:n, num:0}; });
  }
  return ruleRacks(r).map(function(k){ return {id:k.id, row:+k.row, num:+k.num}; });
}
function rowsList(){ var a=[]; for(var i=1;i<=nRows();i++) a.push(i); return a; }
// every (target, task) due on day d
function dueOn(d){
  if(DUE_MEMO[d]) return DUE_MEMO[d];
  var out=[], seen={};
  allRules().forEach(function(r){
    if(!occurs(r,d)) return;
    ruleTargets(r).forEach(function(t){
      var k=t.id+'|'+r.task; if(seen[k]) return; seen[k]=1;
      out.push({id:t.id, row:t.row, num:t.num, task:r.task, rule:r.id, date:d});
    });
  });
  DUE_MEMO[d]=out;
  return out;
}
// prepare-ahead reminders shown on day d (rule.prep days before the job)
function prepOn(d){
  var out=[];
  allRules().forEach(function(r){
    var n=Math.round(num(r.prep)); if(!n) return;
    var target=addDays(d, n);
    // job may be on a later day if closed days are in between
    for(var k=0;k<3 && isClosed(target);k++) target=addDays(target,1);
    if(!occurs(r,target)) return;
    var tg=ruleTargets(r), rows={};
    tg.forEach(function(t){ rows[t.row]=(rows[t.row]||0)+1; });
    out.push({rule:r.id, task:r.task, for:target, rows:Object.keys(rows).map(Number).sort(), racks:tg.length, ref:r.id+'|'+target, date:d});
  });
  return out;
}
function buildIdx(){
  IDX={done:{}, open:{}, prep:{}};
  Object.keys(DB.log).forEach(function(k){
    var l=DB.log[k]; if(l.deleted) return;
    if(l.status==='open'){ IDX.open[l.rack]=l; return; }
    (l.tasks||[]).forEach(function(t){ var key=l.rack+'|'+t; (IDX.done[key]||(IDX.done[key]=[])).push(l.date); });
    if(l.ref) IDX.prep[l.ref]=l;
  });
  Object.keys(IDX.done).forEach(function(k){ IDX.done[k].sort(); });
}
function idx(){ if(!IDX) buildIdx(); return IDX; }
function lastDone(id, t, onOrBefore){
  var a=idx().done[id+'|'+t]; if(!a) return '';
  for(var i=a.length-1;i>=0;i--) if(!onOrBefore || a[i]<=onOrBefore) return a[i];
  return '';
}
function doneOnOrAfter(id, t, d){ var a=idx().done[id+'|'+t]; if(!a) return false; return a[a.length-1]>=d; }
function doneOn(id, t, d){ var a=idx().done[id+'|'+t]; return !!a && a.indexOf(d)>=0; }
// jobs that were due in the last 14 days, are still not done and are not due again today
function overdueOn(d){
  var out=[], seen={}, due={};
  dueOn(d).forEach(function(x){ due[x.id+'|'+x.task]=1; });
  allRules().forEach(function(r){
    var last='';
    for(var i=1;i<=14;i++){ var p=addDays(d,-i); if(p < (r.start||'')) break; if(occurs(r,p)){ last=p; break; } }
    if(!last) return;
    ruleTargets(r).forEach(function(t){
      var k=t.id+'|'+r.task; if(due[k]||seen[k]) return;
      if(doneOnOrAfter(t.id, r.task, last)) return;
      seen[k]=1; out.push({id:t.id, row:t.row, num:t.num, task:r.task, rule:r.id, since:last});
    });
  });
  return out;
}
function nextDue(id, t, from, rk){
  var best='';
  allRules().forEach(function(r){
    if(r.task!==t) return;
    var tg=ruleTargets(r).some(function(x){ return x.id===id; }); if(!tg) return;
    for(var i=0;i<120;i++){ var d=addDays(from,i); if(best && d>=best) break; if(occurs(r,d)){ best=d; break; } }
  });
  return best;
}
// next date anything is due for this rack (any task)
function nextAny(id, from){
  var best='', bt=[];
  for(var i=0;i<60;i++){
    var d=addDays(from,i);
    var ts=dueOn(d).filter(function(x){ return x.id===id && !(i===0 && doneOn(id,x.task,d)); }).map(function(x){ return x.task; });
    if(ts.length){ best=d; bt=ts; break; }
  }
  return {date:best, tasks:bt};
}
function ruleText(r){
  var t='';
  if(r.unit==='once') t='Once on '+niceDate(r.start);
  else if(r.unit==='day') t=(num(r.every)<=1?'Every day':'Every '+r.every+' days');
  else {
    var ds=(r.days&&r.days.length?r.days:[dow(r.start)]).slice().sort().map(function(x){ return DOW[x].en; }).join(', ');
    t=(num(r.every)<=1?'Every week':'Every '+r.every+' weeks')+' on '+ds;
  }
  return t;
}
function ruleTextMy(r){
  if(r.unit==='once') return 'တစ်ကြိမ်သာ';
  if(r.unit==='day') return num(r.every)<=1 ? 'နေ့တိုင်း' : r.every+' ရက်တစ်ကြိမ်';
  return num(r.every)<=1 ? 'အပတ်တိုင်း' : r.every+' ပတ်တစ်ကြိမ်';
}
function ruleWhere(r){
  var rows=(r.rows&&r.rows.length)?r.rows:null;
  var s = rows ? (rows.length===1 ? 'Row '+rows[0] : 'Rows '+rows.join(', ')) : 'All rows';
  if(r.racks && r.racks.length && !task(r.task).row) s+=' · racks '+rangeStr(r.racks.map(Number).sort(function(a,b){return a-b;}));
  else if(!task(r.task).row) s+=' · all racks';
  if(r.sp && r.sp.length) s+=' · '+r.sp.join('/')+' only';
  return s;
}

// ══════════════════════════════════════════════════════════════════
// LOCAL STORAGE — memory first; the Sheet is the master copy.
// Storage is shared with the other SRR apps and can fill up, so a failed
// write never blocks anything (the data still goes to the Sheet).
// ══════════════════════════════════════════════════════════════════
function loadLocal(){
  try{
    var d=JSON.parse(localStorage.getItem(LS_KEY)||'null');
    if(d && d.DB){ DB=d.DB; PENDING=d.PENDING||{}; SERVER_TS=d.SERVER_TS||0; }
  }catch(e){}
  KINDS.forEach(function(k){ if(!DB[k]) DB[k]={}; });
}
function persist(){
  var cut=addDays(todayStr(), -LOG_KEEP_DAYS);
  Object.keys(DB.log).forEach(function(k){ if(DB.log[k].date < cut && !PENDING['log|'+k]) delete DB.log[k]; });
  IDX=null; DUE_MEMO={};
  try{ localStorage.setItem(LS_KEY, JSON.stringify({DB:DB, PENDING:PENDING, SERVER_TS:SERVER_TS})); storeFull=false; }
  catch(e){
    storeFull=true;
    // keep at least the unsent work on this phone
    try{ var o={}; KINDS.forEach(function(k){ o[k]={}; }); Object.keys(PENDING).forEach(function(pk){ var i=pk.indexOf('|'), k=pk.slice(0,i), id=pk.slice(i+1); if(DB[k][id]) o[k][id]=DB[k][id]; });
      localStorage.setItem(LS_KEY, JSON.stringify({DB:o, PENDING:PENDING, SERVER_TS:0})); }catch(e2){}
  }
  var w=document.getElementById('store-warn'); if(w) w.style.display=storeFull?'block':'none';
}
function saveRecord(kind, o, quiet){
  o.updatedAt=Date.now(); if(!o.by) o.by=emp();
  DB[kind][o.id]=o; PENDING[kind+'|'+o.id]=true;
  persist(); pushPending();
  if(!quiet) refresh();
}

// SYNC WITH THE GOOGLE SHEET
// ══════════════════════════════════════════════════════════════════
function setPill(txt,cls){ var p=document.getElementById('pill'); p.textContent='⬤ '+txt; p.className='pill '+(cls||''); }
function pillState(){
  var n=Object.keys(PENDING).length;
  if(!SHEET_URL) setPill('Not connected · '+n+' on device','warn');
  else if(scriptOutdated) setPill('Sheet script old','err');
  else if(n) setPill(n+' not sent · မပို့ရသေး','warn');
  else setPill('Live ✓ '+nowHM(),'ok');
}
function api(body){
  var q=JSON.stringify(body);
  var url=SHEET_URL+'?payload='+encodeURIComponent(q)+'&t='+Date.now();
  var p = url.length<7000 ? fetch(url,{method:'GET'}) : fetch(SHEET_URL,{method:'POST',body:q});   // text/plain → no CORS pre-flight
  return p.then(function(r){ return r.text(); }).then(function(t){
    var j; try{ j=JSON.parse(t); }catch(e){ throw new Error('Sheet did not reply'); }
    if(!j.version || String(j.version)<NEED_SCRIPT_VERSION){ scriptOutdated=true; throw new Error('Sheet script is out of date'); }
    scriptOutdated=false;
    if(!j.ok) throw new Error(j.error||'Sheet error');
    return j;
  });
}
function pushPending(){
  if(!SHEET_URL||pushing){ pillState(); return; }
  var keys=Object.keys(PENDING); if(!keys.length){ pillState(); return; }
  pushing=true; setPill('Saving… · သိမ်းနေ','warn');
  var pk=keys[0], i=pk.indexOf('|'), kind=pk.slice(0,i), id=pk.slice(i+1), obj=DB[kind][id];
  if(!obj){ delete PENDING[pk]; pushing=false; persist(); return pushPending(); }
  var sentAt=obj.updatedAt;
  api({action:'save', kind:kind, obj:obj}).then(function(){
    if(DB[kind][id] && DB[kind][id].updatedAt===sentAt) delete PENDING[pk];
    persist(); pushing=false; pushPending();
  }).catch(function(err){
    pushing=false; pillState(); console.warn('push failed', err);
    if(scriptOutdated) showSetupWarn('⚠️ The Google Sheet script is out of date. Apps Script → Deploy → Manage deployments → ✎ Edit → New version → Deploy. Saves are kept on this device until then. · Sheet script ဟောင်းနေသည်');
  });
}
function mergeList(res){
  var changed=0;
  KINDS.forEach(function(kind){
    (res[kind]||[]).forEach(function(o){
      if(!o || !o.id || PENDING[kind+'|'+o.id]) return;
      var l=DB[kind][o.id];
      if(!l || num(o.updatedAt)>num(l.updatedAt)){ DB[kind][o.id]=o; changed++; }
    });
  });
  if(res.now) SERVER_TS=res.now;
  if(res.lastMod) LAST_MOD=res.lastMod;
  return changed;
}
function pull(){
  if(!SHEET_URL){ pillState(); return Promise.resolve(); }
  var first=!SERVER_TS;
  var p = first ? api({action:'list', days:LOG_KEEP_DAYS}) : api({action:'ping'}).then(function(j){
    if(j.lastMod===LAST_MOD) return null;
    return api({action:'list', since:SERVER_TS-60000});
  });
  return p.then(function(res){
    if(!res){ pillState(); return; }
    var ch=mergeList(res); persist();
    if(first) seedSupplies();
    if(ch){ refreshAfterPull(); if(!first) showToast('🔄 '+ch+' update'+(ch>1?'s':'')+' from other devices · ဒေတာအသစ်'); }
    pillState(); pushPending();
  }).catch(function(e){ console.warn('pull failed',e); if(scriptOutdated) pillState(); else setPill('Offline · အင်တာနက်မရှိ','err'); });
}
function refreshAfterPull(){
  if(RK || LG || RU){ updBadge(); return; }   // never redraw under someone who is typing
  refresh();
}
function syncNow(){ if(!SHEET_URL){ showSetupWarn(); return; } pull(); pushPending(); }
function showSetupWarn(msg){
  var el=document.getElementById('setup-warn');
  el.innerHTML = msg || '⚠️ Not connected to Google Sheets yet — everything is kept on this device only. Paste the Apps Script /exec link into <b>SHEET_URL</b> in index.html. · Google Sheet မချိတ်ရသေးပါ';
  el.style.display='block';
}
// default supply items (fixed ids, so two phones never make duplicates)
function seedSupplies(){
  DEFAULT_SUPPLIES.forEach(function(s){ if(!DB.supply[s.id]) DB.supply[s.id]={id:s.id,name:s.name,my:s.my,unit:s.unit,min:s.min,qty:'',updatedAt:0}; });
}

// status of every rack for one day: due / done / overdue
function rackStatus(d){
  var m={};
  function g(id){ return m[id]||(m[id]={due:0,done:0,over:0,tasks:[]}); }
  dueOn(d).forEach(function(x){ var s=g(x.id); s.due++; s.tasks.push(x.task); if(doneOn(x.id,x.task,d)) s.done++; });
  if(d===todayStr()) overdueOn(d).forEach(function(x){ g(x.id).over++; });
  Object.keys(m).forEach(function(k){ var s=m[k]; s.st = s.over ? 'over' : (s.due && s.done<s.due ? 'due' : (s.due ? 'done' : '')); });
  return m;
}

      rowsList().map(function(row){

        }).join('')+'</tr>';

    '<div class="bars">'+w.days.map(function(x){ return '<div class="bc"><b>'+x.n+'</b><i style="height:'+(w.max?Math.round(x.n/w.max*80):0)+'%"></i>'+DOW[dow(x.d)].en+'</div>'; }).join('')+'</div>'+
    (w.emps.length ? '<div class="note" style="margin-top:8px">'+w.emps.map(function(e){ return '<b>'+esc(e.k)+'</b> '+e.n; }).join(' · ')+'</div>' : '')+
  '</div></div></div>';

  if(low.length) h+='<div class="card"><div class="card-h"><span class="card-t" style="color:#9b1c1c">⚠️ Supplies running low · <span class="my">ပစ္စည်း နည်းနေ</span></span><span class="sp"></span><button class="btn sm" onclick="showTab(\'inv\')">📦 Inventory</button></div><div class="card-b">'+
    low.map(function(s){ return '<span class="chip r" style="margin:2px">'+esc(s.name)+': '+s.qty+' '+esc(s.unit||'')+' (min '+s.min+')</span>'; }).join('')+'</div></div>';

function nextByRow(from, days){
  var out={};
  for(var i=0;i<days;i++){
    var dd=addDays(from,i), cnt={};
    dueOn(dd).forEach(function(x){ if(i===0 && doneOn(x.id,x.task,dd)) return; var k=x.row+'|'+x.task; cnt[k]=(cnt[k]||0)+1; });
    Object.keys(cnt).forEach(function(k){ if(!out[k]) out[k]={date:dd, n:cnt[k]}; });
  }
  return out;
}
function workStats(from, to){
  var logs=doneLogs().filter(function(l){ return l.date>=from && l.date<=to && !/-00$/.test(l.rack); });
  var ms=logs.map(function(l){ return mins(l.start,l.end); }).filter(function(x){ return x!=null && x<600; });
  var days=[], max=0;
  for(var d=from; d<=to; d=addDays(d,1)){ var n=logs.filter(function(l){ return l.date===d; }).length; max=Math.max(max,n); days.push({d:d,n:n}); }
  var em={}; logs.forEach(function(l){ var k=l.emp||'—'; em[k]=(em[k]||0)+1; });
  var racks={}; logs.forEach(function(l){ racks[l.rack]=1; });
  return {count:logs.length, avg: ms.length ? Math.round(ms.reduce(function(a,b){return a+b;},0)/ms.length) : null, days:days, max:max,
    racks:Object.keys(racks).length, emps:Object.keys(em).map(function(k){ return {k:k,n:em[k]}; }).sort(function(a,b){ return b.n-a.n; })};
}
function doneLogs(){ return Object.keys(DB.log).map(function(k){ return DB.log[k]; }).filter(function(l){ return !l.deleted && l.status!=='open'; }); }

function renderToday(){
  var el=document.getElementById('page-today'), t=todayStr();
  if(!todayView) todayView=t;
  var d=todayView, isToday=d===t;
  var due=dueOn(d), over=isToday?overdueOn(d):[], open=idx().open, prep=prepOn(d);
  var h='<div class="card"><div class="card-b topbar">'+
    '<div class="f-emp"><span class="lbl">Your name · <span class="my">သင့်နာမည်</span></span><input class="in" id="emp" list="emp-list" placeholder="Your name · နာမည်" value="'+esc(localStorage_get('srr_gecko_emp')||'')+'" oninput="saveEmp(this.value)">'+empOptions()+'</div>'+
    '<div><span class="lbl">Day · <span class="my">ရက်</span></span><div class="datebox"><button class="btn" onclick="shiftToday(-1)">‹</button><input class="in" type="date" value="'+d+'" onchange="todayView=this.value;renderToday()"><button class="btn" onclick="shiftToday(1)">›</button>'+
    '<button class="btn sm" onclick="todayView=todayStr();renderToday()">Today<br><span class="my">ယနေ့</span></button></div></div>'+
    '<button class="btn pri" onclick="openLog(null,{})">✍️ Log other work<br><span class="my">အခြားလုပ်ငန်း မှတ်ရန်</span></button>'+
  '</div></div>';
  if(isClosed(d)) h+='<div class="prefill">🚪 '+DOW[dow(d)].en+' is a closed day — its work moves to the next open day. · ပိတ်ရက်</div>';

  // group by rack
  var byRack={}, order=[];
  function g(x){ if(!byRack[x.id]){ byRack[x.id]={id:x.id,row:x.row,num:x.num,due:[],over:[]}; order.push(x.id); } return byRack[x.id]; }
  due.forEach(function(x){ g(x).due.push(x.task); });
  over.forEach(function(x){ g(x).over.push(x); });
  Object.keys(open).forEach(function(id){ if(open[id].date===d || isToday){ var l=open[id]; g({id:id,row:l.row,num:l.num}); } });
  var nR=0,nDone=0,nRun=0;
  order.forEach(function(id){ if(/-00$/.test(id)) return; var x=byRack[id]; nR++; if(open[id]) nRun++; else if(x.due.length && x.due.every(function(k){ return doneOn(id,k,d); }) && !x.over.length) nDone++; });
  h+='<div class="strip">'+stat(nR,'Racks to service · <span class="my">လုပ်ရမည့် စင်</span>','#1877f2')+stat(nDone,'Done · <span class="my">ပြီးပြီ</span>','#1a7f37')+
    stat(nRun,'In progress · <span class="my">လုပ်နေဆဲ</span>','#7c3aed')+stat(over.length,'Overdue jobs · <span class="my">နောက်ကျနေ</span>',over.length?'#e02424':'#1a7f37')+'</div>';

  if(prep.length){
    h+='<div class="prep"><div style="font-weight:800;color:#856404;margin-bottom:4px">🧰 Prepare utensils ahead · <span class="my">ပစ္စည်းများ ကြိုတင်ပြင်ဆင်ရန်</span></div>'+
      prep.map(function(p){
        var done=idx().prep[p.ref];
        return '<div class="prep-i'+(done?' done':'')+'"><span>'+task(p.task).ic+' <b>'+esc(task(p.task).en)+'</b> on <b>'+niceDate(p.for)+'</b> — '+(p.rows.length?'Row '+p.rows.join(', '):'')+' ('+p.racks+(task(p.task).row?' row':' rack')+(p.racks>1?'s':'')+')<br><span class="my">'+esc(task(p.task).my)+' · '+niceDateMy(p.for)+'</span></span><span class="sp"></span>'+
          (done ? '<span class="chip g">✓ '+esc(done.emp||'')+' '+esc(done.end||'')+'</span>' : '<button class="btn sm grn" onclick="donePrep(\''+p.ref+'\')">✓ Ready · <span class="my">ပြင်ပြီး</span></button>')+'</div>';
      }).join('')+'</div>';
  }
  if(!order.length){
    h+='<div class="card"><div class="empty">'+(allRules().length ? '✅ Nothing to do on this day. · ဤနေ့ လုပ်ရန် မရှိ' : '📅 No schedule yet — the manager sets up jobs in the <b>📅 Schedule</b> tab. · အချိန်ဇယား မသတ်မှတ်ရသေး')+'</div></div>';
    el.innerHTML=h; tickTimers(); return;
  }
  rowsList().forEach(function(row){
    var ids=order.filter(function(id){ return byRack[id].row==row; }).sort(function(a,b){ return byRack[a].num-byRack[b].num; });
    if(!ids.length) return;
    var dn=ids.filter(function(id){ var x=byRack[id]; return !open[id] && x.due.length && x.due.every(function(k){ return doneOn(id,k,d); }) && !x.over.length; }).length;
    h+='<div class="rowblock"><div class="rowblock-h">Row '+row+' <span class="my">တန်း '+row+'</span><span class="chip">'+ids.length+' to do</span><span class="chip g">'+dn+' done</span></div><div class="tcards">';
    ids.forEach(function(id){ h+=todayCard(byRack[id], d, open[id]); });
    h+='</div></div>';
  });
  el.innerHTML=h; tickTimers();
}
function todayCard(x, d, run){
  var r=DB.rack[x.id], rowLvl=/-00$/.test(x.id);
  var allDone = x.due.length && x.due.every(function(k){ return doneOn(x.id,k,d); }) && !x.over.length;
  var cls = run ? 'run' : (x.over.length ? 'over' : (allDone ? 'done' : ''));
  var h='<div class="tcard '+cls+'"><div class="tcard-h">';
  if(rowLvl) h+='<span class="rk">Whole row '+x.row+'</span>';
  else {
    var t=r ? rackTotals(r) : null;
    h+='<span class="rk">Rack '+x.num+'</span>'+(r?spBadge(r.sp)+'<span class="chip">#'+r.size+' · '+t.trays+' trays</span><span class="note">'+t.n+' 🦎</span>':'');
  }
  h+='<span class="sp"></span>'+(allDone && !run ? '<span class="chip g">✅ Done</span>' : '')+'</div><div class="ttasks">';
  x.due.forEach(function(k){ h+=taskChip(k, doneOn(x.id,k,d)?'done':''); });
  x.over.forEach(function(o){ h+=taskChip(o.task,'over',' · since '+niceDate(o.since)); });
  h+='</div>';
  if(r && !rowLvl){
    var fd=foodOf(r); if(fd) h+='<div class="note">🍽 '+fd+'</div>';
  }
  if(run){
    h+='<div class="note">▶ Started <b>'+esc(run.start)+'</b> by '+esc(run.emp||'—')+' · <span class="timer" data-start="'+esc(run.start)+'" data-date="'+esc(run.date)+'"></span></div>'+
      '<div class="tbtns"><button class="btn grn" onclick="finishRack(\''+x.id+'\')">⏹ Finish · <span class="my">ပြီးဆုံး</span></button></div>';
  } else if(!allDone){
    h+='<div class="tbtns"><button class="btn pri" onclick="startRack(\''+x.id+'\')">▶ Start · <span class="my">စတင်</span></button>'+
      '<button class="btn" onclick="logRack(\''+x.id+'\')">✍️ Log done · <span class="my">မှတ်ရန်</span></button></div>';
  } else {
    h+='<div class="tbtns"><button class="btn sm" onclick="logRack(\''+x.id+'\')">✍️ Log more · <span class="my">ထပ်မှတ်ရန်</span></button></div>';
  }
  return h+'</div>';
}
function foodOf(r){
  var cr={}, mw={};
  for(var i=1;i<=num(r.trays);i++){ var t=trayOf(r,i); if(t.f+t.m+t.u===0) continue; if(t.cr) cr[t.cr]=1; if(t.mw) mw[t.mw]=1; }
  var a=[]; if(Object.keys(cr).length) a.push('Crickets '+Object.keys(cr).sort().join(', ')); if(Object.keys(mw).length) a.push('Mealworms '+Object.keys(mw).join(', '));
  return a.join(' · ');
}
function shiftToday(n){ todayView=addDays(todayView||todayStr(), n); renderToday(); }
function tickTimers(){
  Array.prototype.forEach.call(document.querySelectorAll('.timer'), function(el){
    var s=el.getAttribute('data-start'), dd=el.getAttribute('data-date');
    if(!s){ el.textContent=''; return; }
    var m = dd===todayStr() ? mins(s, nowHM()) : null;
    el.textContent = m==null ? '' : '⏱ '+fmtMin(m);
  });
}
function needEmp(){
  var n=emp(); if(n) return n;
  showToast('Type your name first · နာမည် အရင်ရိုက်ပါ','err');
  var e=document.getElementById('emp'); if(e) e.focus();

}
function dueTasksFor(id, d){
  var a=dueOn(d).filter(function(x){ return x.id===id && !doneOn(id,x.task,d); }).map(function(x){ return x.task; });
  if(d===todayStr()) overdueOn(d).forEach(function(x){ if(x.id===id && a.indexOf(x.task)<0) a.push(x.task); });
  return a;
}
function startRack(id){

  var r=DB.rack[id]; if(r){ l.cr=r.cr||''; l.mw=r.mw||''; }

function finishRack(id){

function logRack(id){ var p=parseRid(id), d=todayView||todayStr(); openLog(null, {rack:id, row:p.row, num:p.num, date:d, tasks:dueTasksFor(id,d)}); }
function parseRid(id){ var m=/^R(\d+)-(\d+)$/.exec(id||''); return m ? {row:+m[1], num:+m[2]} : {row:1, num:0}; }
function donePrep(ref){
  var n=needEmp(); if(!n) return;
  var rid=ref.split('|')[0], r=DB.rule[rid]; if(!r) return;

function rackCard(r, d, s){

function lastAny(id){ var best=''; TASKS.forEach(function(t){ var x=lastDone(id,t.k); if(x>best) best=x; }); return best; }

function closeRack(force){

function moveRack(dir){
  if(!RK || RK._new) return;

function bulkSeg(k, opts, cur){ return '<div class="seg">'+opts.map(function(o){ return '<button class="'+(cur!==undefined && String(cur)===o.k?'on':'')+'" onclick="setBulk(\''+k+'\',\''+o.k+'\')">'+o.l+'</button>'; }).join('')+'</div>'; }
function rangeStr(a){
  var out=[], s=a[0], p=a[0];
  for(var i=1;i<=a.length;i++){ if(a[i]===p+1){ p=a[i]; continue; } out.push(s===p?String(s):s+'–'+p); s=p=a[i]; }
  return out.join(', ');
}
function setBulk(k, v, noRender){ if(v===undefined) delete bulk[k]; else bulk[k]=v; if(!noRender) renderRack(); }
function stepBulk(k, d){

  var cur = bulk[k]!==undefined ? bulk[k] : (one ? one[k] : 0);
  bulk[k]=Math.max(0, num(cur)+d); var el=document.getElementById('bk-'+k); if(el) el.value=bulk[k];
}

function bulkItem(k){
  var sel=Object.keys(traySel); var one=sel.length===1?trayOf(RK,+sel[0]):null;
  if(bulk.i===undefined) bulk.i = one ? one.i.slice() : RK.items.slice();
  var i=bulk.i.indexOf(k); if(i>=0) bulk.i.splice(i,1); else bulk.i.push(k);
  renderRack();

function applyBulk(){
  var sel=Object.keys(traySel).map(Number);
  if(!Object.keys(bulk).length){ showToast('Nothing changed yet · မပြောင်းရသေး','err'); return; }
  sel.forEach(function(i){
    var t=RK.t[i] || {};
    Object.keys(bulk).forEach(function(k){
      var v=bulk[k];
      if(k==='a' && v===''){ delete t.a; return; }
      if(k==='i'){ t.i=v.slice(); return; }
      if(k==='n' && v===''){ delete t.n; return; }
      t[k]=v;
    });
    if(t.i && sameSet(t.i, RK.items)) delete t.i;
    if(t.cr===(RK.cr||'')) delete t.cr;
    if(t.mw===(RK.mw||'')) delete t.mw;
    if(!t.f) delete t.f; if(!t.m) delete t.m; if(!t.u) delete t.u;
    if(Object.keys(t).length) RK.t[i]=t; else delete RK.t[i];
  });
  markRK();
  showToast('✔ Applied to '+sel.length+' tray'+(sel.length>1?'s':'')+' — press Save rack · သိမ်းရန် နှိပ်ပါ','ok');
  traySel={}; bulk={}; renderRack();
}
function sameSet(a,b){ if(a.length!==b.length) return false; return a.every(function(x){ return b.indexOf(x)>=0; }); }

function renderLogPage(){
  var el=document.getElementById('page-log'), t=todayStr();
  if(!logFilter.from){ logFilter.from=addDays(t,-6); logFilter.to=t; }
  var f=logFilter;
  var logs=Object.keys(DB.log).map(function(k){ return DB.log[k]; }).filter(function(l){
    if(l.deleted) return false;

function saveLog(){

function exportLogCSV(){

function renderSched(){
  var el=document.getElementById('page-sched'), t=todayStr();
  if(!calMonth) calMonth=t.slice(0,7);
  if(!calSel) calSel=t;
  var p=calMonth.split('-'), first=new Date(+p[0], +p[1]-1, 1), start=addDays(ymd(first), -first.getDay());
  var h='<div class="card"><div class="card-h"><button class="btn sm" onclick="calShift(-1)">‹</button><span class="card-t" style="min-width:150px;text-align:center">'+
    first.toLocaleDateString('en-GB',{month:'long',year:'numeric'})+'</span><button class="btn sm" onclick="calShift(1)">›</button>'+
    '<button class="btn sm" onclick="calMonth=todayStr().slice(0,7);calSel=todayStr();renderSched()">Today · <span class="my">ယနေ့</span></button><span class="sp"></span>'+
    '<button class="btn pri sm" onclick="newRule(calSel)">＋ New schedule · <span class="my">အချိန်ဇယား အသစ်</span></button></div><div class="card-b"><div class="cal">'+
    DOW.map(function(x){ return '<div class="dow">'+x.en+'<span class="my">'+x.my+'</span></div>'; }).join('');
  for(var i=0;i<42;i++){
    var d=addDays(start,i); if(i===35 && d.slice(0,7)!==calMonth) break;
    var cl=isClosed(d), it=dueOn(d), by={};
    it.forEach(function(x){ by[x.task]=(by[x.task]||0)+1; });
    var ks=Object.keys(by), pr=prepOn(d).length;
    h+='<div class="cday'+(d.slice(0,7)!==calMonth?' other':'')+(cl?' closed':'')+(d===t?' today':'')+(d===calSel?' sel':'')+'" onclick="calSel=\''+d+'\';renderSched()">'+
      '<div class="dn"><span>'+(+d.slice(8))+'</span>'+(pr?'<span title="prepare utensils">🧰</span>':'')+'</div>'+
      (cl ? '<span class="note">Closed<br>ပိတ်ရက်</span>' : ks.slice(0,4).map(function(k){ return '<span class="ev" style="background:'+task(k).c+'">'+task(k).ic+' '+by[k]+'</span>'; }).join('')+(ks.length>4?'<span class="note">+'+(ks.length-4)+' more</span>':''))+'</div>';
  }
  h+='</div><div class="legend">Each box shows the job and how many racks · '+TASKS.map(function(x){ return '<span>'+x.ic+' '+esc(x.en)+'</span>'; }).join('')+'</div></div></div>';

  // selected day
  var dd=calSel, rs=allRules().filter(function(r){ return r.active!==false; });
  var onDay=rs.filter(function(r){ return occurs(r,dd); }), skipped=rs.filter(function(r){ return r.skip && r.skip[dd]; }), pr=prepOn(dd);
  h+='<div class="card"><div class="card-h"><span class="card-t">'+niceDate(dd)+' · '+dd+' <span class="my">'+niceDateMy(dd)+'</span></span><span class="sp"></span>'+
    '<button class="btn sm" onclick="todayView=\''+dd+'\';showTab(\'today\')">🔔 Open task list · <span class="my">လုပ်ငန်းစာရင်း</span></button><button class="btn sm pri" onclick="newRule(\''+dd+'\')">＋ Schedule from this day</button></div><div class="card-b">';
  if(isClosed(dd)) h+='<div class="prefill">🚪 Closed day — work moves to the next open day. · ပိတ်ရက်</div>';
  if(!onDay.length && !skipped.length && !pr.length) h+='<div class="empty">Nothing scheduled on this day. · အချိန်ဇယား မရှိ</div>';
  onDay.forEach(function(r){ h+=ruleRow(r, dd, false); });
  skipped.forEach(function(r){ h+=ruleRow(r, dd, true); });
  pr.forEach(function(p){ h+='<div class="rule"><div class="ic" style="background:#fff3cd">🧰</div><div class="tx"><b>Prepare utensils for '+esc(task(p.task).en)+'</b> on '+niceDate(p.for)+'<br><span class="note">Row '+p.rows.join(', ')+' · '+p.racks+' racks · reminder</span></div></div>'; });
  h+='</div></div>';

  // all rules
  var list=allRules().sort(function(a,b){ return (a.rows&&a.rows[0]||0)-(b.rows&&b.rows[0]||0) || a.task.localeCompare(b.task); });
  h+='<div class="card"><div class="card-h"><span class="card-t">🗓️ All schedules · <span class="my">အချိန်ဇယား အားလုံး</span></span><span class="chip">'+list.length+'</span><span class="sp"></span>'+
    '<button class="btn sm" onclick="addStarter()">⚡ Add a starter set · <span class="my">နမူနာ ထည့်ရန်</span></button></div><div class="card-b">';
  if(!list.length) h+='<div class="empty">No schedules yet. Press <b>＋ New schedule</b>, or <b>⚡ Add a starter set</b> (daily feeding, weekly water bowls, coconut flooring every 2 weeks…) and change it to fit. · အချိန်ဇယား မရှိသေး</div>';
  list.forEach(function(r){ h+=ruleRow(r, null, false); });
  h+='</div></div>';
  el.innerHTML=h;
}
function ruleRow(r, d, skipped){

    (r.prep?' · 🧰 prepare '+r.prep+' day'+(r.prep>1?'s':'')+' before':'')+(r.end?' · until '+r.end:'')+(r.notes?' · '+esc(r.notes):'')+'</span>'+
    (skipped?'<br><span class="chip a">Skipped this day</span>':'')+(d||r.active===false?'':'<br><span class="chip b">Next: '+(nx?niceDate(nx):'—')+'</span>')+(r.active===false?'<br><span class="chip">⏸ Paused</span>':'')+'</div>';

  return h;
}

  var one = RU.rows.length===1, rr = one ? rowRacks(RU.rows[0]) : [];
  var h='<div class="sec">Job · <span class="my">လုပ်ငန်း</span></div><div class="chips">'+
    TASKS.map(function(t){ var on=RU.task===t.k; return '<button class="tog'+(on?' on':'')+'" style="'+(on?'background:'+t.c+';border-color:'+t.c:'')+'" onclick="RU.task=\''+t.k+'\';renderRuleEditor()">'+t.ic+' '+esc(t.en)+'<span class="my">'+esc(t.my)+'</span></button>'; }).join('')+'</div>'+
    '<div class="sec">Which rows · <span class="my">မည်သည့်တန်း</span></div><div class="chips"><button class="tog'+(!RU.rows.length?' on':'')+'" onclick="RU.rows=[];renderRuleEditor()">All rows<span class="my">တန်းအားလုံး</span></button>'+
    rowsList().map(function(n){ return '<button class="tog'+(RU.rows.indexOf(n)>=0?' on':'')+'" onclick="tog(RU.rows,'+n+');renderRuleEditor()">Row '+n+'<span class="my">တန်း '+n+' · '+rowRacks(n).length+' racks</span></button>'; }).join('')+'</div>';
  if(!task(RU.task).row){
    h+='<div class="sec">Which racks · <span class="my">မည်သည့်စင်</span></div>';
    var rowsSel = RU.rows.length ? RU.rows.map(Number) : rowsList();
    var have={}; rowsSel.forEach(function(n){ rowRacks(n).forEach(function(r){ (have[r.num]=have[r.num]||[]).push(r); }); });

    if(RU.racks.length || RU._pick){
      h+='<div class="note" style="margin-bottom:6px">Tap the rack numbers'+(rowsSel.length>1?' — the same rack numbers are used in each chosen row':'')+'. · စင်နံပါတ်များကို နှိပ်ပါ</div><div class="chips">';
      for(var n=1;n<=maxN;n++){

        var lab = hv.length ? hv.map(function(r){ return r.sp; }).filter(function(x,i,a){ return a.indexOf(x)===i; }).join('/') : 'not set up';

      }
      h+='</div><div class="chips" style="margin-top:6px"><span class="note">Quick:</span>'+
        [[1,5],[6,10],[11,15],[1,15]].map(function(p){ return '<button class="tog" onclick="pickRackRange('+p[0]+','+p[1]+')">'+p[0]+'–'+p[1]+'</button>'; }).join('')+
        '<span class="note">or from</span><input class="in" type="number" min="1" id="ru-a" style="width:64px;padding:5px"><span>–</span><input class="in" type="number" min="1" id="ru-b" style="width:64px;padding:5px">'+

    }
    h+='<span class="lbl" style="margin-top:8px">Only these species (optional) · <span class="my">မျိုးစိတ် (မဖြစ်မနေ မဟုတ်)</span></span><div class="chips">'+

  h+='<div class="sec">How often · <span class="my">မည်မျှ မကြာခဏ</span></div><div class="chips" style="margin-bottom:8px">'+
    [['Every day','နေ့တိုင်း','day',1],['Every 2 days','၂ ရက်တစ်ကြိမ်','day',2],['Every week','အပတ်တိုင်း','week',1],['Every 2 weeks','၂ ပတ်တစ်ကြိမ်','week',2],['Every 3 weeks','၃ ပတ်တစ်ကြိမ်','week',3],['Every 4 weeks','၄ ပတ်တစ်ကြိမ်','week',4],['Once only','တစ်ကြိမ်သာ','once',1]].map(function(p){
      var on=RU.unit===p[2] && (p[2]==='once' || num(RU.every)===p[3]);
      return '<button class="tog'+(on?' on':'')+'" onclick="RU.unit=\''+p[2]+'\';RU.every='+p[3]+';RU.prep='+(p[2]==='day'?0:1)+';renderRuleEditor()">'+p[0]+'<span class="my">'+p[1]+'</span></button>'; }).join('')+'</div>'+
    (RU.unit!=='once' ? '<div class="g2"><div><span class="lbl">Every · <span class="my">တိုင်း</span></span><div class="timebox"><input class="in" type="number" min="1" max="60" style="width:90px" value="'+RU.every+'" onchange="RU.every=Math.max(1,Math.round(+this.value)||1);renderRuleEditor()">'+
      '<div class="seg" style="flex:1"><button class="'+(RU.unit==='day'?'on':'')+'" onclick="RU.unit=\'day\';renderRuleEditor()">days<span class="my">ရက်</span></button><button class="'+(RU.unit==='week'?'on':'')+'" onclick="RU.unit=\'week\';renderRuleEditor()">weeks<span class="my">ပတ်</span></button></div></div></div><div></div></div>' : '');
  if(RU.unit==='week') h+='<span class="lbl" style="margin-top:8px">On which days · <span class="my">မည်သည့်နေ့</span></span><div class="seg">'+
    DOW.map(function(x,i){ var cl=closedDays().indexOf(i)>=0; return '<button class="'+(RU.days.indexOf(i)>=0?'on':'')+'"'+(cl?' disabled title="closed day"':'')+' onclick="tog(RU.days,'+i+');renderRuleEditor()">'+x.en+'<span class="my">'+x.my+'</span></button>'; }).join('')+'</div>';
  h+='<div class="g2" style="margin-top:10px"><div><span class="lbl">'+(RU.unit==='once'?'Date':'Starts on')+' · <span class="my">စမည့်ရက်</span></span><input class="in" type="date" value="'+RU.start+'" onchange="RU.start=this.value;renderRuleEditor()"></div>'+
    (RU.unit!=='once'?'<div><span class="lbl">Ends on (optional) · <span class="my">ပြီးမည့်ရက်</span></span><input class="in" type="date" value="'+(RU.end||'')+'" onchange="RU.end=this.value;renderRuleEditor()"></div>':'<div></div>')+'</div>';
  if(!task(RU.task).row) h+='<span class="lbl" style="margin-top:10px">Reminder to prepare the utensils · <span class="my">ပစ္စည်း ကြိုတင်ပြင်ဆင်ရန် သတိပေးချက်</span></span>'+

  h+='<div class="g2" style="margin-top:10px"><div><span class="lbl">Notes for staff · <span class="my">ဝန်ထမ်းများအတွက် မှတ်ချက်</span></span><input class="in" value="'+esc(RU.notes||'')+'" oninput="RU.notes=this.value" placeholder="e.g. wash bowls with F10"></div>'+

function saveRule(){
  if(RU.unit==='week' && !RU.days.length){ showToast('Pick at least one day · နေ့ ရွေးပါ','err'); return; }
  if(!RU.start){ showToast('Pick a start date · စမည့်ရက် ရွေးပါ','err'); return; }
  if(RU._pick && !RU.racks.length && !task(RU.task).row){ showToast('Tap at least one rack, or pick All racks · စင် ရွေးပါ','err'); return; }
  if(!ruleTargets(RU).length && !task(RU.task).row && !confirm('None of these racks are set up yet. Save anyway? It will start working when you add them in ⚙️ Setup. · စင်များ မထည့်ရသေး — သိမ်းမလား?')) return;
  var o=clone(RU); delete o._new; delete o._pick; o.rows=o.rows.map(Number).sort(); o.racks=task(o.task).row?[]:o.racks.map(Number).sort(function(a,b){return a-b;});
  saveRecord('rule', o, true); showToast('✅ Schedule saved · သိမ်းပြီး','ok'); closeRule();
}
function deleteRule(){
  if(!confirm('Delete this schedule? Past service logs stay. · ဖျက်မလား?')) return;
  var r=DB.rule[RU.id]; if(r){ r.deleted=true; saveRecord('rule', r, true); }
  closeRule(); showToast('🗑 Deleted · ဖျက်ပြီး','ok');
}
function addStarter(){
  if(!confirm('Add a starter set of schedules for all rows? You can change or delete each one after. · နမူနာ အချိန်ဇယား ထည့်မလား?')) return;
  var d=todayStr(); if(isClosed(d)) d=addDays(d,1);
  var mon=addDays(sunOf(d),1), wed=addDays(sunOf(d),3);
  var set=[
    {task:'FEEDC', unit:'day', every:2, start:d, prep:0, notes:'Check cricket size on each rack'},
    {task:'WATER', unit:'day', every:1, start:d, prep:0},
    {task:'CALC',  unit:'week', every:1, days:[1], start:mon<d?addDays(mon,7):mon, prep:0},
    {task:'NEWS',  unit:'week', every:1, days:[3], start:wed<d?addDays(wed,7):wed, prep:1},
    {task:'COCO',  unit:'week', every:2, days:[1], start:mon<d?addDays(mon,7):mon, prep:1},
    {task:'UTEN',  unit:'week', every:2, days:[3], start:wed<d?addDays(wed,7):wed, prep:1}
  ];
  set.forEach(function(s,i){ saveRecord('rule', Object.assign({id:uid('S')+i, rows:[], racks:[], sp:[], days:s.days||[], end:'', active:true, notes:''}, s), true); });
  showToast('⚡ Added '+set.length+' schedules · ထည့်ပြီး','ok'); renderSched();
}

function allSupplies(){ return Object.keys(DB.supply).map(function(k){ return DB.supply[k]; }).filter(function(s){ return !s.deleted; }).sort(function(a,b){ return (a.ord||0)-(b.ord||0) || a.name.localeCompare(b.name); }); }
function isLow(s){ return s.qty!=='' && s.qty!=null && num(s.min)>0 && num(s.qty)<=num(s.min); }
function renderInv(){
  var el=document.getElementById('page-inv'), racks=allRacks(), T=totals(racks);
  var cell=function(g){ return g && g.n ? '<b>'+g.n+'</b><div class="note">'+sexStr(g.f,g.m,g.u)+'</div>' : '<span style="color:#ccc">—</span>'; };
  var h='<div class="card"><div class="card-h"><span class="card-t">🦎 Animals by species &amp; age · <span class="my">မျိုးစိတ်နှင့် အရွယ်အလိုက်</span></span><span class="sp"></span><button class="btn grn sm" onclick="exportTrayCSV()">⬇ All trays CSV</button></div><div class="tbl-wrap"><table class="t"><thead><tr><th>Species<span class="my">မျိုးစိတ်</span></th><th>Racks<span class="my">စင်</span></th><th>Trays used<span class="my">ဗန်း</span></th>'+
    AGES.map(function(a){ return '<th>'+a.en+'<span class="my">'+a.my+'</span></th>'; }).join('')+'<th>♀</th><th>♂</th><th>?</th><th>Total<span class="my">စုစုပေါင်း</span></th></tr></thead><tbody>';
  SPECIES.forEach(function(s){
    var x=T.sp[s.k]; if(!x) return;
    h+='<tr><td><span class="sp-dot" style="background:'+s.c+'"></span><b>'+s.k+'</b> '+esc(s.en)+'</td><td>'+x.racks+'</td><td>'+x.used+' / '+x.trays+'</td>'+AGES.map(function(a){ return '<td>'+cell(x.age[a.k])+'</td>'; }).join('')+
      '<td>'+x.f+'</td><td>'+x.m+'</td><td>'+x.u+'</td><td><b>'+x.n+'</b></td></tr>';
  });
  h+='<tr class="tot"><td>Total · စုစုပေါင်း</td><td>'+T.racks+'</td><td>'+T.used+' / '+T.trays+'</td>'+AGES.map(function(a){ return '<td>'+T.age[a.k].n+'</td>'; }).join('')+'<td>'+T.f+'</td><td>'+T.m+'</td><td>'+T.u+'</td><td>'+T.n+'</td></tr></tbody></table></div></div>';
  // by row
  h+='<div class="card"><div class="card-h"><span class="card-t">🗄️ Animals by row · <span class="my">တန်းအလိုက်</span></span></div><div class="tbl-wrap"><table class="t"><thead><tr><th>Row<span class="my">တန်း</span></th><th>Racks</th><th>Trays used</th>'+
    SPECIES.map(function(s){ return '<th style="color:'+s.c+'">'+s.k+'</th>'; }).join('')+'<th>Total</th></tr></thead><tbody>'+
    rowsList().map(function(n){ var x=totals(rowRacks(n)); return '<tr><td><b>Row '+n+'</b></td><td>'+x.racks+'</td><td>'+x.used+' / '+x.trays+'</td>'+SPECIES.map(function(s){ var y=x.sp[s.k]; return '<td>'+(y?y.n:'—')+'</td>'; }).join('')+'<td><b>'+x.n+'</b></td></tr>'; }).join('')+
    '</tbody></table></div></div>';
  // supplies
  var sup=allSupplies(), low=sup.filter(isLow).length;
  h+='<div class="card"><div class="card-h"><span class="card-t">🧰 Supplies in stock · <span class="my">ပစ္စည်း လက်ကျန်</span></span>'+(low?'<span class="chip r">'+low+' low</span>':'')+'<span class="sp"></span><button class="btn sm pri" onclick="addSupply()">＋ Add item · <span class="my">ပစ္စည်း ထည့်ရန်</span></button></div><div class="card-b">'+
    '<div class="supply" style="font-size:10.5px;font-weight:800;color:var(--muted);padding-top:0"><span>Item · ပစ္စည်း</span><span>In stock · လက်ကျန်</span><span class="mn">Alert below · အနည်းဆုံး</span><span>Unit</span><span></span></div>'+
    sup.map(function(s){
      return '<div class="supply'+(isLow(s)?' low':'')+'"><div class="nm">'+esc(s.name)+(isLow(s)?' ⚠️':'')+'<div class="my">'+esc(s.my||'')+'</div></div>'+
        '<div class="cnt"><button class="btn" onclick="supStep(\''+s.id+'\',-1)">−</button><input class="in" type="number" min="0" value="'+esc(s.qty==null?'':s.qty)+'" onchange="supSet(\''+s.id+'\',\'qty\',this.value)"><button class="btn" onclick="supStep(\''+s.id+'\',1)">＋</button></div>'+
        '<input class="in mn" type="number" min="0" value="'+esc(s.min==null?'':s.min)+'" onchange="supSet(\''+s.id+'\',\'min\',this.value)">'+
        '<span class="note">'+esc(s.unit||'')+'</span><button class="x" title="remove" onclick="supDel(\''+s.id+'\')">✕</button></div>';
    }).join('')+'<div class="note" style="margin-top:8px">Changes save straight away. Low items show on the Dashboard and in the 5 PM email. · ချက်ချင်း သိမ်းသည်</div></div></div>';
  el.innerHTML=h;
}
function supSet(id, k, v){ var s=clone(DB.supply[id]); s[k] = v==='' ? '' : Math.max(0, num(v)); saveRecord('supply', s, true); renderInv(); }
function supStep(id, d){ var s=DB.supply[id]; supSet(id, 'qty', String(Math.max(0, num(s.qty)+d))); }
function supDel(id){ if(!confirm('Remove '+DB.supply[id].name+'? · ဖယ်ရှားမလား?')) return; var s=clone(DB.supply[id]); s.deleted=true; saveRecord('supply', s, true); renderInv(); }
function addSupply(){
  var n=prompt('Item name · ပစ္စည်း အမည်'); if(!n) return;
  var u=prompt('Unit (pcs, kg, bags…) · ယူနစ်','pcs')||'';
  saveRecord('supply', {id:uid('S-'), name:n.trim(), my:'', unit:u, min:'', qty:''}, true); renderInv();
}
function exportTrayCSV(){
  var rows=[['Row','Rack','Species','Tray size','Tray','Age','Females','Males','Unsexed','Total','Utensils','Cricket','Mealworm','Note']];
  allRacks().forEach(function(r){ for(var i=1;i<=num(r.trays);i++){ var t=trayOf(r,i);
    rows.push([r.row,r.num,r.sp,'#'+r.size,i,age(t.a).en,t.f,t.m,t.u,t.f+t.m+t.u,t.i.map(function(k){ return item(k).en; }).join('; '),t.cr,t.mw,t.n]); } });
  downloadCSV(rows, 'GeckoRoom_Trays_'+todayStr()+'.csv');
}

    '<div style="display:flex;align-items:flex-end"><button class="btn grn" style="width:100%" onclick="quickBuild()">＋ Create racks · <span class="my">စင်များ ဖန်တီးရန်</span></button></div></div></div></div>';
  h+='<div class="card"><div class="card-h"><span class="card-t">🏠 Room settings · <span class="my">အခန်း ဆက်တင်</span></span></div><div class="card-b">'+
    '<div class="g2"><div><span class="lbl">Number of rows · <span class="my">တန်း အရေအတွက်</span></span><input class="in" type="number" id="st-rows" min="1" max="12" value="'+nRows()+'"></div><div></div></div>'+
    '<span class="lbl" style="margin-top:10px">Closed days (no work) · <span class="my">ပိတ်ရက်</span></span><div class="seg" id="st-closed">'+
      DOW.map(function(x,i){ return '<button class="'+(closedDays().indexOf(i)>=0?'on':'')+'" data-d="'+i+'" onclick="this.classList.toggle(\'on\')">'+x.en+'<span class="my">'+x.my+'</span></button>'; }).join('')+'</div>'+
    '<div class="note" style="margin:4px 0 10px">Work that falls on a closed day moves to the next open day. · ပိတ်ရက်တွင် ကျသော အလုပ်ကို နောက်ရက်သို့ ရွှေ့မည်</div>'+
    '<span class="lbl">Staff names (one per line) · <span class="my">ဝန်ထမ်း နာမည်များ</span></span><textarea class="in" id="st-emps" rows="5">'+esc((s.emps||[]).join('\n'))+'</textarea>'+
    '<div style="text-align:right;margin-top:10px"><button class="btn grn" onclick="saveSettings()">💾 Save settings · <span class="my">သိမ်းရန်</span></button></div></div></div></div>';
  // rack list
  var racks=allRacks();
  h+='<div class="card"><div class="card-h"><span class="card-t">📋 All racks · <span class="my">စင် အားလုံး</span></span><span class="chip">'+racks.length+'</span></div>'+
    (racks.length ? '<div class="tbl-wrap"><table class="t"><thead><tr><th>Row</th><th>Rack</th><th>Species</th><th>Tray size</th><th>Trays</th><th>Used</th><th>Animals</th><th></th></tr></thead><tbody>'+
      racks.map(function(r){ var t=rackTotals(r); return '<tr><td>Row '+r.row+'</td><td><b>'+r.num+'</b></td><td>'+spBadge(r.sp)+'</td><td>#'+r.size+'</td><td>'+r.trays+'</td><td>'+t.used+'</td><td>'+t.n+'</td><td><button class="btn sm" onclick="openRack(\''+r.id+'\')">✏️ Edit</button></td></tr>'; }).join('')+
    '</tbody></table></div>' : '<div class="empty">No racks yet. · စင် မရှိသေး</div>')+'</div>';
  h+='<div class="card"><div class="card-h"><span class="card-t">☁️ Google Sheet · <span class="my">ချိတ်ဆက်မှု</span></span></div><div class="card-b">'+
    '<div>'+(SHEET_URL?'✅ Connected':'⚠️ Not connected — paste the /exec link into SHEET_URL in index.html')+'</div><div class="note">App version '+APP_VERSION+' · needs Sheet script '+NEED_SCRIPT_VERSION+' · '+Object.keys(PENDING).length+' waiting to send</div>'+
    '<div style="margin-top:8px"><button class="btn" onclick="syncNow()">🔄 Sync now · <span class="my">ယခု ချိန်ကိုက်ရန်</span></button></div></div></div>';
  el.innerHTML=h;
}
function quickBuild(){
  var row=+document.getElementById('qb-row').value, a=Math.round(+document.getElementById('qb-a').value)||1, b=Math.round(+document.getElementById('qb-b').value)||a;
  var spk=document.getElementById('qb-sp').value, size=+document.getElementById('qb-size').value, trays=Math.max(1,Math.min(200,Math.round(+document.getElementById('qb-trays').value)||24)), ag=document.getElementById('qb-age').value;
  if(b<a){ var x=a; a=b; b=x; }
  if(b-a>39){ showToast('Max 40 racks at a time','err'); return; }
  var made=0, skip=0;
  for(var n=a;n<=b;n++){
    var id=rackId(row,n);
    if(DB.rack[id] && !DB.rack[id].deleted){ skip++; continue; }
    saveRecord('rack', {id:id, row:row, num:n, sp:spk, size:size, trays:trays, age:ag, items:['NP','WB'], cr:'', mw:'', notes:'', t:{}}, true); made++;
  }
  showToast('✅ Row '+row+': '+made+' racks made'+(skip?', '+skip+' already there':'')+' · ဖန်တီးပြီး','ok');
  renderSetup();
}
function saveSettings(){
  var s=clone(settings());
  s.id='main'; s.rows=Math.max(1,Math.min(12,Math.round(+document.getElementById('st-rows').value)||5));
  s.closed=Array.prototype.map.call(document.querySelectorAll('#st-closed button.on'), function(b){ return +b.getAttribute('data-d'); });
  s.emps=document.getElementById('st-emps').value.split('\n').map(function(x){ return x.trim(); }).filter(String);
  saveRecord('settings', s, true); showToast('✅ Settings saved · သိမ်းပြီး','ok'); renderSetup();
}

function tick(){
  var d=new Date();
  document.getElementById('clock').textContent=d.toLocaleDateString('en-GB',{day:'2-digit',month:'short'})+' '+nowHM();
  tickTimers();
}
document.addEventListener('DOMContentLoaded', function(){
  loadLocal(); seedSupplies();
  var t=localStorage_get('srr_gecko_tab'); if(TABS.indexOf(t)<0) t='dash';
  showTab(t); tick(); setInterval(tick, 30000);
  if(!SHEET_URL){ showSetupWarn(); pillState(); }
  else { pull(); setInterval(function(){ pull(); pushPending(); }, 20000); }
  document.addEventListener('visibilitychange', function(){ if(!document.hidden){ if(SHEET_URL){ pull(); pushPending(); } if(!RK&&!LG&&!RU) refresh(); } });
  window.addEventListener('online', function(){ if(SHEET_URL){ pull(); pushPending(); } });
  // new day → task list moves on by itself
  var day=todayStr();
  setInterval(function(){ if(todayStr()!==day){ if(todayView===day) todayView=todayStr(); day=todayStr(); if(!RK&&!LG&&!RU) refresh(); } }, 60000);
  window.addEventListener('beforeunload', function(e){ if(rkDirty){ e.preventDefault(); e.returnValue=''; } });
});
</script>
